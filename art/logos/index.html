<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatterday Logo Mockups</title>
<style>
  :root { --bg:#14161c; --panel:#1b1e27; --text:#e8eaf0; --muted:#8e94a7; --accent:#7c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 16px; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  h1 { margin:0 0 4px; font-size:26px; } .sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(700px,1fr)); gap:20px; max-width:1440px; }
  .card { margin:0; background:var(--panel); border-radius:12px; padding:14px; }
  .swatches { display:flex; gap:10px; }
  .sw { flex:1; display:flex; align-items:flex-end; gap:12px; padding:14px; border-radius:8px; }
  .sw.light { background:#f3f1ec; } .sw.dark { background:#0b0c10; }
  .sw img { display:block; }
  figcaption { margin-top:10px; font-size:14px; line-height:1.4; color:var(--muted); }
  figcaption b { color:var(--text); }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } .swatches { flex-direction:column; } .sw img:first-child { width:100%; height:auto; max-width:256px; } }
</style></head><body>
<h1>Chatterday &mdash; logo mockups</h1>
<p class="sub">11 concepts &middot; each shown at 256px and 32px on light and dark backgrounds</p>
<div class="grid">
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="01-lips-calendar.svg" width="256" height="256" alt="Lips on a calendar page"><img src="01-lips-calendar.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="01-lips-calendar.svg" width="256" height="256" alt=""><img src="01-lips-calendar.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>01. Lips on a calendar page</b> &mdash; The owner's idea: a tear-off calendar page where the lips are the date - the day we talk.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="02-bubble-calendar.svg" width="256" height="256" alt="Calendar speech bubble"><img src="02-bubble-calendar.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="02-bubble-calendar.svg" width="256" height="256" alt=""><img src="02-bubble-calendar.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>02. Calendar speech bubble</b> &mdash; A speech bubble with calendar binding rings and header, typing dots inside: chat, on a schedule.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="03-waveform-week.svg" width="256" height="256" alt="Week as a waveform"><img src="03-waveform-week.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="03-waveform-week.svg" width="256" height="256" alt=""><img src="03-waveform-week.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>03. Week as a waveform</b> &mdash; Seven equalizer bars, one per weekday, building to a tall red Saturday: the week gets louder toward hangout day.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="04-c-monogram.svg" width="256" height="256" alt="Talking C monogram"><img src="04-c-monogram.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="04-c-monogram.svg" width="256" height="256" alt=""><img src="04-c-monogram.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>04. Talking C monogram</b> &mdash; A heavy rounded C whose open mouth lets out three growing sound dots.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="05-pixel-bubble.svg" width="256" height="256" alt="Pixel bubble"><img src="05-pixel-bubble.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="05-pixel-bubble.svg" width="256" height="256" alt=""><img src="05-pixel-bubble.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>05. Pixel bubble</b> &mdash; 16x16 pixel-art speech bubble with pixel lips, phosphor green on black with CRT scanlines - matches the client's retro look.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="06-sat-chat.svg" width="256" height="256" alt="SAT becomes CHAT"><img src="06-sat-chat.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="06-sat-chat.svg" width="256" height="256" alt=""><img src="06-sat-chat.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>06. SAT becomes CHAT</b> &mdash; Day-of-week pun: the calendar page's SAT is struck out and replaced by CHAT - Saturday, renamed.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="07-calendar-mascot.svg" width="256" height="256" alt="Chatty calendar mascot"><img src="07-calendar-mascot.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="07-calendar-mascot.svg" width="256" height="256" alt=""><img src="07-calendar-mascot.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>07. Chatty calendar mascot</b> &mdash; A friendly calendar-page character mid-sentence - big eyes, blushing cheeks, open mouth, speech lines.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="08-stacked-wordmark.svg" width="256" height="256" alt="Stacked wordmark"><img src="08-stacked-wordmark.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="08-stacked-wordmark.svg" width="256" height="256" alt=""><img src="08-stacked-wordmark.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>08. Stacked wordmark</b> &mdash; Wordmark-only: CHAT / TER / DAY stacked in heavy caps, three colors - reads as a name first, icon second.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="09-chattering-teeth.svg" width="256" height="256" alt="Wind-up chattering teeth"><img src="09-chattering-teeth.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="09-chattering-teeth.svg" width="256" height="256" alt=""><img src="09-chattering-teeth.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>09. Wind-up chattering teeth</b> &mdash; The classic wind-up chattering-teeth toy, mid-chomp with a key in its side - literal 'chatter', playful mascot energy.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="10-round-badge.svg" width="256" height="256" alt="Retro club patch"><img src="10-round-badge.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="10-round-badge.svg" width="256" height="256" alt=""><img src="10-round-badge.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>10. Retro club patch</b> &mdash; A round club-patch badge with ring text and headphones at the center - 'members only' clubhouse feel.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="11-talking-sun.svg" width="256" height="256" alt="Talking sun"><img src="11-talking-sun.svg" width="32" height="32" alt=""></div>
    <div class="sw dark"><img src="11-talking-sun.svg" width="256" height="256" alt=""><img src="11-talking-sun.svg" width="32" height="32" alt=""></div>
  </div>
  <figcaption><b>11. Talking sun</b> &mdash; A sun with a speech-bubble tail: 'day' + 'chatter' in one bold, simple shape that survives 16px.</figcaption>
</figure>
</div>
</body></html>
