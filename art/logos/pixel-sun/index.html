<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Sun Logos</title>
<style>
  :root { --bg:#14161c; --panel:#1b1e27; --text:#e8eaf0; --muted:#8e94a7; --accent:#7c8cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 16px; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
  h1 { margin:0 0 4px; font-size:26px; } .sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(700px,1fr)); gap:20px; max-width:1440px; }
  .card { margin:0; background:var(--panel); border-radius:12px; padding:10px; }
  .swatches { display:flex; gap:10px; }
  .sw { flex:1; display:flex; align-items:flex-end; gap:8px; padding:10px; border-radius:8px; }
  .sw.light { background:#f3f1ec; } .sw.dark { background:#0b0c10; }
  .sw img { display:block; }
  figcaption { margin-top:10px; font-size:14px; line-height:1.4; color:var(--muted); }
  figcaption b { color:var(--text); }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } .swatches { flex-direction:column; } .sw img:first-child { width:100%; height:auto; max-width:256px; } }
</style></head><body>
<h1>Chatterday &mdash; pixel talking sun</h1>
<p class="sub">10 variants of #11's talking sun in #5's pixel style &middot; each at 256px, 32px and 16px on light and dark</p>
<div class="grid">
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="01-phosphor-sun.svg" width="256" height="256" alt="Phosphor talking sun"><img src="01-phosphor-sun.svg" width="32" height="32" alt=""><img src="01-phosphor-sun.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="01-phosphor-sun.svg" width="256" height="256" alt=""><img src="01-phosphor-sun.svg" width="32" height="32" alt=""><img src="01-phosphor-sun.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>01. Phosphor talking sun</b> &mdash; 16px grid, phosphor-green mono with scanlines: a solid sun with a stepped tail, knocked-out typing dots and dim dot rays.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="02-amber-bubble-sun.svg" width="256" height="256" alt="Amber sun in a bubble"><img src="02-amber-bubble-sun.svg" width="32" height="32" alt=""><img src="02-amber-bubble-sun.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="02-amber-bubble-sun.svg" width="256" height="256" alt=""><img src="02-amber-bubble-sun.svg" width="32" height="32" alt=""><img src="02-amber-bubble-sun.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>02. Amber sun in a bubble</b> &mdash; 16px grid, amber CRT mono with scanlines: the #5 bubble outline with a tiny rayed sun inside it.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="03-sunrise-horizon.svg" width="256" height="256" alt="Sunrise over a bubble horizon"><img src="03-sunrise-horizon.svg" width="32" height="32" alt=""><img src="03-sunrise-horizon.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="03-sunrise-horizon.svg" width="256" height="256" alt=""><img src="03-sunrise-horizon.svg" width="32" height="32" alt=""><img src="03-sunrise-horizon.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>03. Sunrise over a bubble horizon</b> &mdash; 24px grid, full warm sunrise bands: a half sun rising behind a dark speech bubble that forms the horizon, sun-colored typing dots.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="04-night-talker.svg" width="256" height="256" alt="Night talker"><img src="04-night-talker.svg" width="32" height="32" alt=""><img src="04-night-talker.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="04-night-talker.svg" width="256" height="256" alt=""><img src="04-night-talker.svg" width="32" height="32" alt=""><img src="04-night-talker.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>04. Night talker</b> &mdash; 16px grid, indigo night with scanlines: an amber sun with a face mid-sentence (open red mouth), stars and chatter marks.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="05-one-bit.svg" width="256" height="256" alt="1-bit sun"><img src="05-one-bit.svg" width="32" height="32" alt=""><img src="05-one-bit.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="05-one-bit.svg" width="256" height="256" alt=""><img src="05-one-bit.svg" width="32" height="32" alt=""><img src="05-one-bit.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>05. 1-bit sun</b> &mdash; 12px grid, pure black and white: the chunkiest possible sun-bubble with three knocked-out dots. Built for 16px.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="06-gameboy.svg" width="256" height="256" alt="Handheld 4-tone sun"><img src="06-gameboy.svg" width="32" height="32" alt=""><img src="06-gameboy.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="06-gameboy.svg" width="256" height="256" alt=""><img src="06-gameboy.svg" width="32" height="32" alt=""><img src="06-gameboy.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>06. Handheld 4-tone sun</b> &mdash; 16px grid, classic handheld 4-tone green: an outlined sun face talking, with a little reply bubble and dot rays.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="07-hires-sun.svg" width="256" height="256" alt="Hi-res talking sun"><img src="07-hires-sun.svg" width="32" height="32" alt=""><img src="07-hires-sun.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="07-hires-sun.svg" width="256" height="256" alt=""><img src="07-hires-sun.svg" width="32" height="32" alt=""><img src="07-hires-sun.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>07. Hi-res talking sun</b> &mdash; 32px grid, faithful pixel port of #11: indigo-to-coral banded sky, pixel-line rays, shaded sun, tail and typing dots.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="08-dot-rays.svg" width="256" height="256" alt="Typing-dot rays"><img src="08-dot-rays.svg" width="32" height="32" alt=""><img src="08-dot-rays.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="08-dot-rays.svg" width="256" height="256" alt=""><img src="08-dot-rays.svg" width="32" height="32" alt=""><img src="08-dot-rays.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>08. Typing-dot rays</b> &mdash; 24px grid, dark tile with scanlines: rays drawn as amber-and-indigo dot pairs, so the whole halo reads as typing ellipses.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="09-ray-tail.svg" width="256" height="256" alt="Ray tail"><img src="09-ray-tail.svg" width="32" height="32" alt=""><img src="09-ray-tail.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="09-ray-tail.svg" width="256" height="256" alt=""><img src="09-ray-tail.svg" width="32" height="32" alt=""><img src="09-ray-tail.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>09. Ray tail</b> &mdash; 12px grid, yellow on coral-red: one of the eight dot rays stretches into the speech tail; red dots punch through the sun.</figcaption>
</figure>
<figure class="card">
  <div class="swatches">
    <div class="sw light"><img src="10-outrun-sun.svg" width="256" height="256" alt="Outrun sun"><img src="10-outrun-sun.svg" width="32" height="32" alt=""><img src="10-outrun-sun.svg" width="16" height="16" alt=""></div>
    <div class="sw dark"><img src="10-outrun-sun.svg" width="256" height="256" alt=""><img src="10-outrun-sun.svg" width="32" height="32" alt=""><img src="10-outrun-sun.svg" width="16" height="16" alt=""></div>
  </div>
  <figcaption><b>10. Outrun sun</b> &mdash; 32px grid, synthwave: a striped yellow-to-red sunset sun with typing dots, a tail dripping to an indigo horizon.</figcaption>
</figure>
</div>
</body></html>
